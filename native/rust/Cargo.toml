[package]
name = "solidcraft-hmos"
version = "0.40.0-rc.3"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "solidcraft_hmos"
crate-type = ["staticlib"]

[dependencies]
solidcraft-ui-egui = { path = "../../../solidcraft/crates/ui-egui" }
# 0.40 起 system_language() 从 ui-egui::i18n 迁到 ui-text crate（locale.rs 用于选 CJK 字体）。
solidcraft-ui-text = { path = "../../../solidcraft/crates/ui-text" }
# SMLib 自 0.40 起改为纯 Rust 的 solidcore（tangency-labs/solidcore，git 依赖，由 solidcraft-smlib 引入），
# 已默认编入引擎（kernel -> smlib），不再需要独立 feature，也不再需要 C++ 交叉编译。
solidcraft-engine = { path = "../../../solidcraft/crates/engine" }
egui = "0.37"
egui-wgpu = "0.37"
# GLES/EGL 后端是鸿蒙 NDK 能直接用的那套；丢 gles 鸿蒙就没渲染后端（与 photocraft 同源教训）。
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "gles"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
raw-window-handle = "0.6"
libc = "0.2"

# 上游用 vendored egui-wgpu；[patch] 只对 workspace 根生效，本适配层是另一个 workspace，必须抄过来。
# wgpu-hal 用 photocraft 验证过的、带 GLES uniform-block 修补的同一版本，目录不存在即报错（不悄悄用旧的）。
[patch.crates-io]
egui-wgpu = { path = "../../../solidcraft/vendor/egui-wgpu" }
wgpu-hal = { path = "../../third_party/wgpu-hal-30.0.1" }

[workspace]
