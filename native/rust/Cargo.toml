[package]
name = "solidcraft-hmos"
version = "0.30.1"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "solidcraft_hmos"
crate-type = ["staticlib"]

[dependencies]
solidcraft-ui-egui = { path = "../../../solidcraft/crates/ui-egui" }
# smlib：把 NVIDIA SMLib B-Rep 内核静态链入引擎，STEP/IGES 导入才可用（否则 "this build has no SMLib"）。
# 需要 C++ 交叉编译：build.rs 用 cc 把 SMLib C++ 源码编到 aarch64-unknown-linux-ohos（见 run_on_device.sh 里的 CXX）。
solidcraft-engine = { path = "../../../solidcraft/crates/engine", features = ["smlib"] }
egui = "0.36"
egui-wgpu = "0.36"
# GLES/EGL 后端是鸿蒙 NDK 能直接用的那套；丢 gles 鸿蒙就没渲染后端（与 photocraft 同源教训）。
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "gles"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
raw-window-handle = "0.6"
libc = "0.2"

# 上游用 vendored egui-wgpu；[patch] 只对 workspace 根生效，本适配层是另一个 workspace，必须抄过来。
# wgpu-hal 用 photocraft 验证过的、带 GLES uniform-block 修补的同一版本，目录不存在即报错（不悄悄用旧的）。
[patch.crates-io]
egui-wgpu = { path = "../../../solidcraft/vendor/egui-wgpu" }
wgpu-hal = { path = "../../third_party/wgpu-hal-30.0.1" }

[workspace]
